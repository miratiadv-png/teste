<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>MRTI Feriado 20/11</title>
<link rel="stylesheet" href="../fonts/local.css">
<style>
  :root {
    --gold: #d6b25a; --gold-hi: #f0d488; --cream: #f6f0e2; --mute: rgba(246,240,226,.64); --ink: #0c1310; --red-hi: #ff8a72;
    --serif: 'Cormorant Garamond', Garamond, serif; --play: 'Playfair Display', serif;
    --sans: 'Inter', Helvetica, Arial, sans-serif; --mono: 'JetBrains Mono', ui-monospace, monospace;
    --metal: linear-gradient(180deg, #fffbe6 0%, #ffe9a8 22%, #f2c766 46%, #d4a03e 62%, #b98a2e 74%, #f3d27a 92%, #fff0bf 100%);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #222; display: flex; gap: 40px; padding: 40px; width: max-content; align-items: flex-start; }
  .slide { position: relative; width: 1080px; height: 1350px; overflow: hidden; color: var(--cream); font-family: var(--sans); font-variant-numeric: lining-nums;
    background: radial-gradient(ellipse 90% 60% at 50% 34%, #17251a 0%, #0b120d 55%, #050806 100%); }
  .slide.story { height: 1920px; }
  .slide::before { content: ""; position: absolute; inset: 0; opacity: .5; pointer-events: none; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .28 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .glow { position: absolute; border-radius: 50%; filter: blur(90px); pointer-events: none; }
  .metal { background: var(--metal); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .wrap { position: absolute; left: 80px; right: 80px; display: flex; flex-direction: column; align-items: center; text-align: center; }

  .crest { width: 118px; filter: drop-shadow(0 16px 40px rgba(0,0,0,.6)); }
  .kick { margin-top: 20px; font-family: var(--mono); font-weight: 700; font-size: 24px; letter-spacing: .34em; padding-left: .34em; color: var(--gold-hi); }
  .date { margin-top: 12px; display: flex; align-items: flex-end; gap: 22px; }
  .date .d { font-family: var(--play); font-weight: 800; font-size: 250px; line-height: .8; letter-spacing: -.04em;
    filter: drop-shadow(0 4px 3px rgba(40,26,4,.9)) drop-shadow(0 26px 60px rgba(0,0,0,.6)) drop-shadow(0 0 40px rgba(255,214,120,.22)); }
  .date .m { text-align: left; padding-bottom: 16px; }
  .date .m b { display: block; font-family: var(--play); font-weight: 700; font-size: 72px; line-height: .9; }
  .date .m span { display: block; font-family: var(--mono); font-weight: 700; font-size: 26px; letter-spacing: .3em; color: var(--mute); margin-top: 10px; }
  .h { margin-top: 30px; font-family: var(--serif); font-weight: 600; font-size: 94px; line-height: .98; letter-spacing: -.01em; }
  .h em { font-style: italic; }
  .sub { margin-top: 18px; font-size: 30px; line-height: 1.4; font-weight: 500; color: var(--mute); max-width: 900px; }
  .sub b { color: var(--cream); font-weight: 700; }
  .days { margin-top: 32px; display: flex; gap: 18px; }
  .day { width: 300px; padding: 22px 20px 20px; border-radius: 22px; background: rgba(14,22,17,.85); border: 1.5px solid rgba(240,212,136,.25); }
  .day .w { font-family: var(--mono); font-weight: 700; font-size: 20px; letter-spacing: .26em; color: var(--mute); }
  .day .n { font-family: var(--play); font-weight: 700; font-size: 58px; line-height: 1.05; margin-top: 4px; }
  .day .s { margin-top: 8px; display: inline-block; padding: 7px 16px; border-radius: 999px; font-family: var(--mono); font-weight: 700; font-size: 18px; letter-spacing: .18em; }
  .day.off { border-color: rgba(255,138,114,.45); background: rgba(40,12,8,.55); }
  .day.off .n { color: var(--red-hi); }
  .day.off .s { background: rgba(229,69,47,.9); color: #fff; }
  .day.on { background: linear-gradient(180deg, #f6dc94, #c99f45); border-color: #fff0bf; color: var(--ink); box-shadow: 0 0 40px rgba(240,212,136,.35); }
  .day.on .w { color: rgba(12,19,16,.65); }
  .day.on .s { background: var(--ink); color: var(--gold-hi); }
  .honor { margin-top: 28px; font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 31px; line-height: 1.3; color: var(--cream); max-width: 820px; }
  .honor b { font-style: normal; font-family: var(--mono); font-weight: 700; font-size: 18px; letter-spacing: .3em; color: var(--gold-hi); display: block; margin-bottom: 10px; }
  .foot { position: absolute; left: 80px; right: 80px; display: flex; justify-content: space-between; align-items: center; }
  .foot img { height: 78px; }
  .foot .c { text-align: right; font-family: var(--sans); font-size: 22px; letter-spacing: .2em; line-height: 1.8; color: var(--cream); }
  .foot .c b { color: var(--gold); font-weight: 600; margin-right: .5em; }
  .story .foot { justify-content: center; }
  .story .foot .c { text-align: center; font-size: 24px; }
  .story .crest { width: 150px; }
  .story .kick { margin-top: 26px; font-size: 26px; }
  .story .date .d { font-size: 300px; }
  .story .date .m b { font-size: 84px; }
  .story .h { margin-top: 36px; font-size: 104px; }
  .story .sub { font-size: 32px; }
  .story .days { margin-top: 40px; }
  .story .honor { margin-top: 38px; font-size: 36px; }
</style>
</head>
<body>
<script>
const body = (story) => `
  <img class="crest" src="../brand/crest.png">
  <div class="kick">FERIADO NACIONAL</div>
  <div class="date"><div class="d metal">20</div><div class="m"><b class="metal">NOV</b><span>SEXTA-FEIRA</span></div></div>
  <div class="h">Amanhã não teremos<br><em class="metal">expediente.</em></div>
  <div class="sub">Em respeito ao <b>Dia Nacional de Zumbi e da Consciência Negra</b>, a MRTI estará fechada. Respondemos todas as mensagens no nosso retorno.</div>
  <div class="days">
    <div class="day off"><div class="w">SEXTA</div><div class="n">20/11</div><div class="s">FECHADO</div></div>
    <div class="day on"><div class="w">SEGUNDA</div><div class="n">23/11</div><div class="s">VOLTAMOS</div></div></div>
  ${true ? `<div class="honor"><b>20 DE NOVEMBRO</b>Memória, respeito e igualdade: um dia para lembrar Zumbi dos Palmares e a luta do povo negro.</div>` : ''}`;
const contact = `<div class="c"><div><b>WHATSAPP</b>(35) 91021-6941</div><div><b>SITE</b>WWW.GRUPOMRTI.COM.BR</div></div>`;
document.body.innerHTML = `
  <section class="slide" id="feed"><div class="glow" style="left:240px;top:-120px;width:600px;height:600px;background:rgba(214,178,90,.13)"></div>
    <div class="wrap" style="top:58px">${body(false)}</div>
    <div class="foot" style="bottom:56px"><img src="../brand/lockup.png">${contact}</div></section>
  <section class="slide story" id="story"><div class="glow" style="left:240px;top:120px;width:600px;height:600px;background:rgba(214,178,90,.13)"></div>
    <div class="wrap" style="top:236px">${body(true)}</div>
    <div class="foot" style="bottom:250px">${contact}</div></section>`;
</script>
</body>
</html>
